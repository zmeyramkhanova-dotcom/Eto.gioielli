<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --hero-bg: #100D0B;
    --gold: #C9A461;
    --gold-dim: #9C8158;
    --cream: #F7F4EE;
    --ink: #17140F;
    --ink-dim: #8A8477;
    --line: #E7E1D5;
    --card-bg: #FFFFFF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero ---------- */

  header{
    background:
      radial-gradient(ellipse at 50% -10%, #2A2118 0%, var(--hero-bg) 55%);
    padding: 80px 24px 60px;
    text-align: center;
  }

  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--gold);
    margin-bottom: 26px;
  }

  h1.logo{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(44px, 8vw, 76px);
    margin: 0;
    color: #F3EEE3;
    letter-spacing: 0.01em;
  }

  h1.logo em{
    font-style: italic;
    font-weight: 500;
    color: var(--gold);
  }

  .tagline{
    margin-top: 20px;
    font-size: 18px;
    color: #C9C2B4;
    font-weight: 300;
  }

  .access-note{
    margin-top: 30px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    border: 1px solid #4A3F2E;
    border-radius: 999px;
    padding: 10px 24px;
  }

  .access-note::before{
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  /* ---------- Filter tabs ---------- */

  .filters-wrap{
    background: var(--cream);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .filters{
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 22px 24px;
  }

  .filter-btn{
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    font-weight: 400;
    background: none;
    border: none;
    color: var(--ink);
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
  }

  .filter-btn.active{
    background: var(--ink);
    color: #fff;
  }

  .filter-btn:not(.active):hover{
    color: var(--gold-dim);
  }

  /* ---------- Catalog grid ---------- */

  main{
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 24px 100px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 30px 24px;
  }

  .piece{
    background: var(--card-bg);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .piece-media{
    position: relative;
    aspect-ratio: 4 / 5;
    background: #E9E3D6;
    overflow: hidden;
    cursor: default;
  }

  .piece-media img,
  .piece-media video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .piece-media.is-video{ cursor: pointer; }

  .media-placeholder{
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
  }

  .video-badge{
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(15, 12, 9, 0.72);
    color: #fff;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 6px 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  .video-badge svg{ width: 9px; height: 9px; }

  .sound-toggle{
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(15, 12, 9, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .sound-toggle svg{ width: 15px; height: 15px; }

  .piece-meta{
    padding: 20px 18px 22px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .piece-cat{
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: var(--gold-dim);
    margin-bottom: 6px;
  }

  .piece-name{
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .piece-price{
    font-size: 14.5px;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .piece-desc{
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-dim);
    margin: 0 0 14px;
  }

  .btn-write{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 15px 0;
    margin-top: auto;
    transition: background 0.2s ease;
  }

  .btn-write svg{ width: 18px; height: 18px; flex-shrink: 0; }

  .btn-write:hover{ background: #000; }

  /* ---------- Empty state ---------- */

  .empty{
    grid-column: 1 / -1;
    text-align: center;
    padding: 90px 20px;
    border: 1px dashed var(--line);
  }

  .empty-title{
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    margin: 0 0 10px;
  }

  .empty-text{
    font-size: 14px;
    color: var(--ink-dim);
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ---------- Footer ---------- */

  footer{
    background: var(--hero-bg);
    padding: 40px 24px;
    text-align: center;
  }

  .footer-brand{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .footer-note{
    font-size: 12.5px;
    color: #9C9284;
  }

  @media (max-width: 480px){
    header{ padding: 60px 20px 44px; }
    main{ padding: 36px 16px 72px; }
    .filters{ gap: 2px; padding: 16px 12px; }
    .filter-btn{ padding: 8px 14px; font-size: 14px; }
  }
</style>
</head>

  let activeCategory = "Все";

  function renderFilters(){
    const wrap = document.getElementById('filters');
    const all = ["Все", ...CATEGORIES];
    wrap.innerHTML = all.map(cat => `
      <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>
    `).join('');

    wrap.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        renderFilters();
        renderGrid();
      });
    });
  }

  function mediaMarkup(item, idx){
    if(item.type === 'video'){
      return `
        <div class="video-badge">
          <svg viewBox="0 0 10 10" fill="white"><polygon points="0,0 10,5 0,10"/></svg>
          ВИДЕО
        </div>
        <video id="video-${idx}" src="${item.media}" autoplay muted loop playsinline preload="auto"></video>
        <div class="sound-toggle" data-role="sound">
          <svg viewBox="0 0 24 24" fill="white"><path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="17" y1="8" x2="22" y2="16" stroke="white" stroke-width="1.6"/><line x1="22" y1="8" x2="17" y2="16" stroke="white" stroke-width="1.6"/></svg>
        </div>
      `;
    }
    return item.media
      ? `<img src="${item.media}" alt="${item.name}">`
      : `<div class="media-placeholder">ФОТО</div>`;
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    const list = activeCategory === "Все" ? ITEMS : ITEMS.filter(i => i.category === activeCategory);

    if(list.length === 0){
      grid.innerHTML = `
        <div class="empty">
          <p class="empty-title">${ITEMS.length === 0 ? 'Каталог пока пуст' : 'В этой категории пока нет изделий'}</p>

        </div>
      `;
      return;
    }

    grid.innerHTML = list.map((item, idx) => `
      <div class="piece">
        <div class="piece-media ${item.type === 'video' ? 'is-video' : ''}" data-idx="${idx}" data-type="${item.type}">
          ${mediaMarkup(item, idx)}
        </div>
        <div class="piece-meta">
          <div class="piece-cat">${item.category.toUpperCase()}</div>
          <h3 class="piece-name">${item.name}</h3>
          ${item.price ? `<p class="piece-price">${item.price}</p>` : ""}

            Написать
          </a>
        </div>
      </div>
    `).join('');

      const toggle = el.querySelector('.sound-toggle');
      if(!video || !toggle) return;
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
      });
    });
  }

  renderFilters();
  renderGrid();
</script>

</body>
</html>
